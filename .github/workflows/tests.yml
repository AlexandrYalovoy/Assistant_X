# The tests on the systems and the Python the project claims (pyproject.toml classifiers): Linux and Windows,
# Python 3.11 (the version of the release and of the offline medium). Every test but the slow ones (the guards of the
# repository among them: English-only code, the medium, the workspace). No models, no torch, no video card, no
# LibreOffice or Tesseract: the tests that need them are marked slow or skip themselves (the author runs the whole
# suite on Windows: scripts/check.ps1). The actions are pinned by the commit of their release tag (the comment names the tag).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python: ["3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the program (words, intake) with the versions of the release
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c assistant_x/setup/constraints.txt -e ".[intake]" faiss-cpu
          python -m pip install -r requirements/requirements-dev.txt
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Tests (all but the slow ones)
        env:
          PYTHONUTF8: "1"
          AX_NO_OPEN: "1"
        run: python -m pytest -q -p no:cacheprovider -m "not slow" tests
